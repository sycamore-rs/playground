name: Build and deploy playground

on:
  push:
    branches: [main]
  workflow_dispatch:

# Do not interrupt a deployment halfway through or deploy two commits concurrently.
concurrency:
  group: playground-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-sycamore@0.2.1

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install editor build dependencies
        working-directory: client
        run: npm ci

      - name: Build frontend
        env:
          # Override with / for a custom domain or user/organization Pages site.
          # TODO: fix once cargo-sycamore supports passing public-url by CLI flags.
          # PUBLIC_URL: ${{ vars.PAGES_PUBLIC_URL || '/playground/' }}
          # Embedded in the frontend WASM; empty falls back to same-origin requests.
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
        run: cargo sycamore build --release --locked

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist/public

  backend:
    name: Build and publish backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/sycamore-rs/playground:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export immutable image reference
        id: image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "image=ghcr.io/sycamore-rs/playground@$DIGEST" >> "$GITHUB_OUTPUT"

  deploy-backend:
    name: Deploy backend to Azure
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Log in to Azure using OpenID Connect
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy the published image
        env:
          IMAGE: ${{ needs.backend.outputs.image }}
        run: |
          az extension add --name containerapp --upgrade --allow-preview true
          az containerapp update \
            --name sycamore-playground \
            --resource-group sycamore-playground \
            --image "$IMAGE" \
            --output none

  deploy-frontend:
    name: Deploy frontend to GitHub Pages
    # Both builds must succeed, and Azure must accept the backend deployment first.
    needs: [frontend, backend, deploy-backend]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the frontend artifact from this workflow run
        id: deployment
        uses: actions/deploy-pages@v4
