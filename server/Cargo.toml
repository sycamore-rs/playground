[package]
name = "sycamore-playground-server"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
sycamore-playground-shared = { path = "../shared" }
tokio = { version = "1.54.1", features = ["full"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal", "process"] }
