[watch]
ignore = ["node_modules", "generated"]

# Generate the editor bundle before Trunk processes its script asset.
[[hooks]]
stage = "pre_build"
command = "sh"
command_arguments = ["-c", 'cd "$TRUNK_SOURCE_DIR" && npm run build:editor']

[tools]
tailwindcss = "4.3.3"

# Keep browser API calls same-origin during local development.
[[proxy]]
backend = "http://127.0.0.1:3000/compile"

[[proxy]]
backend = "http://127.0.0.1:3000/artifacts/"
