[package]
name = "sycamore-playground-client"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gloo-net = { version = "0.7", default-features = false, features = ["http", "json"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlElement", "Storage", "Window"] }
sycamore = "0.9.4"
sycamore-playground-shared = { path = "../shared" }
